<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luna App</title>
    <meta name="description" content="Luna App - musiqi, video, AI və daha çoxu.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ÜST HİSSƏ -->
    <header class="topbar">

        <div class="logo">
            🌙 <span>Luna App</span>
        </div>

        <div class="top-actions">

            <!-- Axtarış -->
            <div class="search-box">
                🔍
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Axtar..."
                    autocomplete="off"
                >
            </div>

            <!-- Ayarlar -->
            <button id="settingsButton" class="icon-button" title="Ayarlar">
                ⚙️
            </button>

        </div>

    </header>


    <!-- ƏSAS HİSSƏ -->
    <main class="container">

        <section class="welcome">
            <h1>Luna App 🌙</h1>
            <p>Sevdiyin tətbiqlər və xidmətlər bir yerdə.</p>
        </section>


        <!-- TƏTBİQ KARTLARI -->
        <section class="app-section">

            <div class="section-title">
                <h2>Tətbiqlər</h2>
            </div>

            <div class="app-grid" id="appGrid">

                <div class="app-card" data-name="Luna Music musiqi">
                    <div class="app-icon music-icon">🎵</div>
                    <div class="app-info">
                        <h3>Luna Music</h3>
                        <p>Musiqilərini dinlə</p>
                    </div>
                    <button onclick="openMusic()">Aç</button>
                </div>


                <div class="app-card" data-name="Luna Video video">
                    <div class="app-icon video-icon">🎬</div>
                    <div class="app-info">
                        <h3>Luna Video</h3>
                        <p>Videolarına bax</p>
                    </div>
                    <button onclick="openVideo()">Aç</button>
                </div>


                <div class="app-card" data-name="Luna Tools alətlər">
                    <div class="app-icon tools-icon">🛠️</div>
                    <div class="app-info">
                        <h3>Luna Tools</h3>
                        <p>Faydalı alətlər</p>
                    </div>
                    <button onclick="openTools()">Aç</button>
                </div>

            </div>

            <p id="noResults" class="no-results">
                Heç nə tapılmadı.
            </p>

        </section>

    </main>


    <!-- AYARLAR PANELİ -->
    <div id="settingsPanel" class="popup">

        <div class="popup-content">

            <div class="popup-header">
                <h2>⚙️ Ayarlar</h2>
                <button id="closeSettings" class="close-button">✕</button>
            </div>


            <div class="setting-item">
                <label>🌗 Görünüş</label>

                <select id="themeSelect">
                    <option value="dark">Qaranlıq</option>
                    <option value="light">İşıqlı</option>
                </select>
            </div>


            <div class="setting-item">
                <label>🎨 Rəng</label>

                <select id="colorSelect">
                    <option value="purple">Bənövşəyi</option>
                    <option value="blue">Mavi</option>
                    <option value="pink">Çəhrayı</option>
                    <option value="green">Yaşıl</option>
                    <option value="red">Qırmızı</option>
                    <option value="orange">Narıncı</option>
                    <option value="cyan">Mavi-yaşıl</option>
                </select>
            </div>


            <div class="setting-item">
                <label>🔤 Yazı tipi</label>

                <select id="fontSelect">
                    <option value="system">System</option>
                    <option value="arial">Arial</option>
                    <option value="georgia">Georgia</option>
                    <option value="verdana">Verdana</option>
                    <option value="monospace">Monospace</option>
                </select>
            </div>


            <div class="setting-item">
                <label>🔵 İkon rəngi</label>

                <input
                    type="color"
                    id="iconColor"
                    value="#9b5cff"
                >
            </div>


            <div class="setting-item">
                <label>🖼️ Luna ikonunu dəyiş</label>

                <input
                    type="file"
                    id="iconUpload"
                    accept="image/*"
                >
            </div>


            <button id="resetSettings" class="reset-button">
                🔄 Ayarları sıfırla
            </button>

        </div>

    </div>


    <!-- LUNA AI DÜYMƏSİ -->
    <button id="aiFloatingButton" class="ai-floating-button" title="Luna AI">
        🤖
    </button>


    <!-- LUNA AI PƏNCƏRƏSİ -->
    <div id="aiWindow" class="ai-window">

        <div class="ai-header">

            <div>
                <strong>🤖 Luna AI</strong>
                <small>AI köməkçin</small>
            </div>

            <button id="closeAI" class="close-button">
                ✕
            </button>

        </div>


        <div id="aiMessages" class="ai-messages">

            <div class="ai-message">
                Salam! Mən Luna AI-yam 🌙
                <br>
                Mənə sualını yaza bilərsən.
            </div>

        </div>


        <div class="ai-input-area">

            <input
                type="text"
                id="aiInput"
                placeholder="Sualını yaz..."
                autocomplete="off"
            >

            <button id="sendAI">
                ➤
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
